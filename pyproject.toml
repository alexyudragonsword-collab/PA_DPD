[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "padpd"
version = "0.1.0"
description = "WiFi 7 PA behavioral modeling + DPD AI-assisted R&D platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["DPD", "power-amplifier", "digital-predistortion", "WiFi7",
            "802.11be", "RF", "behavioral-modeling"]
authors = [{ name = "padpd contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/alexyudragonsword-collab/PA_DPD"
Repository = "https://github.com/alexyudragonsword-collab/PA_DPD"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
nn = ["torch>=2.0"]
onnx = ["onnx>=1.15", "onnxruntime"]   # ONNX handoff (export + verify)
gui = ["streamlit>=1.36", "plotly>=5.20"]
gui-qt = ["pyside6>=6.6", "markdown>=3.5"]
packaging = ["pyinstaller", "nuitka[onefile]>=2.4"]   # desktop exe builders

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# This code was written against flake8's defaults - 79 columns, imports at
# the top unless a guard has to run first. Ruff replaces flake8 here and is
# configured to say the same thing, so the 77 `# noqa: E402` and 8
# `# noqa: BLE001` comments already in the tree keep meaning what their
# authors meant instead of turning into stale directives.
line-length = 79
target-version = "py310"
extend-exclude = [
    # Vendored verbatim from the python-android-apk skill; see
    # scripts/android/README.md. Reformatting them destroys the one property
    # that makes them auditable - they are the upstream files plus a single
    # documented change.
    "scripts/android/android_wheel.py",
    "scripts/android/inspect_apk.py",
]

[tool.ruff.lint]
# B905 is the reason bugbear is here: a zip() that silently truncates is a
# whole class of quiet numerical bug in this codebase, where the two arms
# are usually a signal and its per-sample annotation.
#
# E402 and BLE001 are kept enabled rather than switched off wholesale. Both
# are legitimate here in specific places - a guarded import after
# `pytest.importorskip`, a GUI handler that must survive whatever an
# algorithm throws - and the rule the project already follows is "allowed,
# but marked at the line". Disabling them would silently permit the
# unmarked case too.
select = ["E", "W", "F", "I", "B", "C4", "UP",
          "BLE001", "PLE", "PLW1510", "SIM115", "RUF100"]
ignore = [
    # `dict(a=1, b=2)` is how this codebase builds plot kwargs and JSON
    # payloads, and it reads better there than a brace literal. The rule
    # would rewrite 48 call sites to no benefit.
    "C408",
]

[tool.ruff.lint.per-file-ignores]
# A translation table: one Chinese UI string and its English on each line.
# The strings are the data. Wrapping them hides which pairs with which.
"gui_core/i18n.py" = ["E501"]
# The long lines here are inside the Verilog this module emits, where a
# Python-side wrap would land in the generated file.
"src/padpd/deploy/rtl.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running neural training tests (CI runs them in the full lane only)",
]
