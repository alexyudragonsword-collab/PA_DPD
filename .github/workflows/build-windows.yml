name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    # branch pushes only build when packaging inputs change (path
    # filters are not evaluated for tag pushes, so v* tags always build)
    paths:
      - packaging/**
      - gui_qt/**
      - gui_core/**
      - src/**
      - manual/**
      - examples/**
      - pyproject.toml
      - .github/workflows/build-windows.yml

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: pip install -e .[gui-qt] pyinstaller

      - name: Install CPU torch (full variant)
        if: matrix.variant == 'full'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build with PyInstaller
        working-directory: packaging
        env:
          PADPD_NO_TORCH: ${{ matrix.variant == 'slim' && '1' || '0' }}
        run: pyinstaller --clean --noconfirm padpd_qt.spec

      - name: Launch smoke test
        shell: pwsh
        working-directory: packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -PassThru .\dist\padpd-desktop\padpd-desktop.exe
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Error "app exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "smoke OK: app stayed alive for 20 s"

      - name: Package zip
        shell: pwsh
        working-directory: packaging
        run: |
          Compress-Archive -Path dist\padpd-desktop `
            -DestinationPath padpd-desktop-windows-${{ matrix.variant }}.zip
          Get-Item padpd-desktop-windows-${{ matrix.variant }}.zip |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB)}}

      - uses: actions/upload-artifact@v4
        with:
          name: padpd-desktop-windows-${{ matrix.variant }}
          path: packaging/padpd-desktop-windows-${{ matrix.variant }}.zip
          retention-days: 14

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/padpd-desktop-windows-${{ matrix.variant }}.zip

  # Nuitka single-file (.exe) build — slim only (no torch). Independent of
  # the PyInstaller matrix above: Nuitka compiles to C and is much slower,
  # so it must not block or replace the fast onedir path.
  build-nuitka:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies (slim, no torch)
        run: pip install -e .[gui-qt] "nuitka[onefile]"

      - name: Build single-file exe with Nuitka
        run: |
          python -m nuitka --standalone --onefile --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --include-package=gui_qt --include-package=gui_core --include-package=padpd `
            --include-module=matplotlib.backends.backend_qtagg `
            --include-data-dir=manual=manual `
            --include-data-dir=gui_qt/assets=gui_qt/assets `
            --include-data-dir=examples=examples `
            --include-data-files=gui_qt/style_template.qss=gui_qt/style_template.qss `
            --nofollow-import-to=streamlit,plotly,playwright,IPython,pytest,tkinter,PyQt5,PyQt6,torch,onnx,onnxscript,onnxruntime,nvidia,triton `
            --windows-icon-from-ico=packaging/icon/padpd.ico `
            --windows-console-mode=disable `
            --company-name=padpd --product-name=padpd-desktop `
            --product-version=0.1.0 --file-version=0.1.0 `
            --output-dir=packaging/build_nuitka --output-filename=padpd-desktop.exe `
            packaging/desktop_launcher_qt.py

      - name: Launch smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -PassThru .\packaging\build_nuitka\padpd-desktop.exe
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Error "app exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "smoke OK: single-file app stayed alive for 20 s"

      - uses: actions/upload-artifact@v4
        with:
          name: padpd-desktop-windows-onefile
          path: packaging/build_nuitka/padpd-desktop.exe
          retention-days: 14

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/build_nuitka/padpd-desktop.exe
