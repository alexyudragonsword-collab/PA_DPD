name: Android

# Builds the app and runs its tests on an emulator. Phase 0 used this to
# answer the feasibility questions (all five criteria passed - see
# android/README.md); it now guards the chart pipeline.
#
# Deliberately not part of CI's push trigger: it downloads an Android
# SDK, a Chaquopy toolchain and an emulator image, so it runs only when
# the Android module changes or someone asks for it.

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      # The workflow shells out to these; a fix to one of them that does
      # not also touch android/ would otherwise never be exercised.
      - ".github/scripts/*android*"
      - ".github/scripts/*gradle*"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      # The workflow shells out to these; a fix to one of them that does
      # not also touch android/ would otherwise never be exercised.
      - ".github/scripts/*android*"
      - ".github/scripts/*gradle*"

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.10.2"

jobs:
  # Acceptance criterion 1 starts here, before any build: does Chaquopy's
  # Android wheel repository actually carry the packages padpd needs?
  #
  # Run 3 showed it carries numpy (numpy-1.26.2 ... android_21_arm64_v8a)
  # but that an unpinned `install "scipy"` fell through to a PyPI SOURCE
  # tarball, which cannot cross-compile for Android. Two very different
  # causes - no scipy at all, versus a scipy too old to win the version
  # race against PyPI - so list the repo rather than guess at a pin.
  wheels:
    name: List Chaquopy's Android wheels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the Chaquopy package index
        run: |
          # Index path is tied to the Chaquopy version; 16.0.0 serves
          # pypi-13.1, as seen in the build log's download URLs.
          idx=https://chaquo.com/pypi-13.1
          for pkg in numpy scipy; do
            echo "## $pkg"
            if body=$(curl -sSf "$idx/$pkg/"); then
              echo "$body" \
                | grep -oE '[A-Za-z0-9_.+-]+\.whl' \
                | sort -u -V \
                | sed 's/^/  /'
            else
              echo "  NOT IN THE REPOSITORY (curl failed for $idx/$pkg/)"
            fi
            echo
          done | tee -a "$GITHUB_STEP_SUMMARY"

  # The Compose screenshot plugin is versioned separately from AGP and
  # its versions are not guessable - and Google Maven is not reachable
  # from every development environment, so "just try it" costs a full
  # build to learn one string. Same reasoning as the Chaquopy job above:
  # ask the index, print the answer, pin from the printout.
  screenshot-plugin-versions:
    name: List Compose screenshot plugin versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Google Maven
        run: |
          base=https://dl.google.com/dl/android/maven2/com/android/compose/screenshot
          for artifact in com.android.compose.screenshot.gradle.plugin \
                          screenshot-test-gradle-plugin; do
            echo "## $artifact"
            if body=$(curl -sSf "$base/$artifact/maven-metadata.xml"); then
              echo "$body" \
                | grep -oE '<version>[^<]+</version>' \
                | sed -E 's|</?version>||g; s/^/  /'
            else
              echo "  NOT FOUND ($base/$artifact/maven-metadata.xml)"
            fi
            echo
          done | tee -a "$GITHUB_STEP_SUMMARY"

      # The version list alone does not say which one goes with AGP
      # 8.7.2, and the plugin must match - that is the whole reason it is
      # versioned separately.
      #
      # An earlier version of this step tried to grep the AGP version out
      # of each POM with a lazy quantifier, which ERE does not have, so
      # it reported "not found" for every candidate and said nothing
      # about whether the dependency was absent or the pattern was. Print
      # the coordinates instead and read them: a query whose negative
      # result is ambiguous is not worth running.
      - name: What each candidate POM declares
        run: |
          base=https://dl.google.com/dl/android/maven2/com/android/compose/screenshot/screenshot-test-gradle-plugin
          for v in 0.0.1-alpha06 0.0.1-alpha07 0.0.1-alpha08 \
                   0.0.1-alpha09 0.0.1-alpha10; do
            echo "## $v"
            curl -sSf "$base/$v/screenshot-test-gradle-plugin-$v.pom" \
              | grep -E '<(groupId|artifactId|version|name|description)>' \
              | sed -E 's/^[[:space:]]*/  /'
            echo
          done | tee -a "$GITHUB_STEP_SUMMARY"

  # Criterion 4 (APK size), plus the things a build proves on its own:
  # that the plugin versions resolve, that Chaquopy has arm64 numpy and
  # scipy wheels, and that the Kotlin compiles.
  build:
    name: Build arm64 release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy runs pip with a local interpreter ("buildPython"), and pip
      # checks each wheel's Requires-Python against the interpreter it is
      # RUNNING under - not against the target. So this must match the
      # `python version` in app/build.gradle. With 3.11 here, pip
      # downloaded the correct cp310 Android wheels and then rejected
      # scipy: "requires a different Python: 3.11.16 not in >=3.8,<3.11".
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.10"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: ./.github/scripts/gen-gradle-wrapper.sh android "$GRADLE_VERSION"

      - name: Assemble release (arm64-v8a)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PpadpdBuildPython="${{ steps.py.outputs.python-path }}" \
            2>&1 | tee "$RUNNER_TEMP/gradle-assemble.log"

      # Gradle prints "What went wrong" ABOVE its stack trace, so on a long
      # failure the one line that matters scrolls far from the end of the
      # job log - and --stacktrace makes that worse, not better. Re-print
      # the tail from a step of its own so the message lands at the bottom
      # of the log and in the run summary.
      - name: Surface Gradle failure
        if: failure()
        run: .github/scripts/surface-gradle-failure.sh "$RUNNER_TEMP/gradle-assemble.log"

      # Scale mapping, blob decoding and spec parsing run on the JVM in
      # seconds. Putting them here rather than behind the emulator keeps
      # the feedback on the renderer's arithmetic fast.
      - name: Unit tests (JVM)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest \
            -PpadpdBuildPython="${{ steps.py.outputs.python-path }}" \
            2>&1 | tee "$RUNNER_TEMP/gradle-unit.log"

      - name: Surface unit test failure
        if: failure()
        run: .github/scripts/surface-gradle-failure.sh "$RUNNER_TEMP/gradle-unit.log"

      # Golden images of the chart renderer, drawn by layoutlib on the
      # JVM rather than by the emulator. The emulator's version comes
      # from the runner image and moves on GitHub's schedule, so a pixel
      # comparison there reddens for reasons unrelated to the commit;
      # layoutlib is pinned by the plugin version.
      #
      # Self-bootstrapping: with no reference images it generates them
      # and uploads them, and with reference images it compares. Neither
      # branch can fail for the want of a first run, and the development
      # environment that wrote this cannot download artifacts to seed
      # them by hand - see android/README.md.
      - name: Chart golden images (JVM, layoutlib)
        working-directory: android
        run: |
          set -o pipefail
          # Where the plugin keeps reference images is a property of the
          # plugin, and the first attempt hard-coded a guess at it. The
          # step then passed while producing nothing: update ran, wrote
          # its images somewhere, and the guessed path matched none of
          # them. Search for them instead, and print what the build
          # actually produced so the next question is answered by the
          # log rather than by another guess.
          refs=$(find app/src -path '*creenshot*' -name '*.png' 2>/dev/null | wc -l)
          if [ "$refs" -gt 0 ]; then
            echo "### comparing against $refs reference images"
            task=validateDebugScreenshotTest
          else
            echo "### no reference images yet - generating them"
            task=updateDebugScreenshotTest
          fi
          ./gradlew ":app:$task" \
            -PpadpdBuildPython="${{ steps.py.outputs.python-path }}" \
            2>&1 | tee "$RUNNER_TEMP/gradle-golden.log"
          echo "### every screenshot-related file under app/"
          find app -path '*creenshot*' \
            \( -name '*.png' -o -name '*.html' -o -name '*.json' \) \
            | sort | sed 's/^/  /' | head -80
          echo "### (end)"

          # A preview that throws is reported as "There were some
          # issues with rendering one or more previews" and the build
          # still exits zero. That is how twenty-eight blank images - 800
          # bytes each - were produced by a green step.
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-android-preview-renders.py" \
            app/build/outputs/screenshotTest-results/preview/debug/results.json

      - name: Surface golden image failure
        if: failure()
        run: .github/scripts/surface-gradle-failure.sh "$RUNNER_TEMP/gradle-golden.log"

      # Paths are preserved (cp --parents) so the artifact itself shows
      # where the plugin puts things - the question that cost a run.
      - name: Collect golden images
        if: always()
        working-directory: android
        run: |
          out="$GITHUB_WORKSPACE/golden-images"
          mkdir -p "$out"
          find app -path '*creenshot*' \
            \( -name '*.png' -o -name '*.html' \) \
            -exec cp --parents {} "$out/" \; 2>/dev/null || true
          echo "collected $(find "$out" -name '*.png' | wc -l) PNGs"

      - name: Upload golden images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-golden-images
          path: golden-images/**
          if-no-files-found: warn

      # The drawer shell is only reached when built with it, so a build
      # that never passes -PpadpdNav=drawer never compiles that half.
      # Assembling it here is what stops the parallel scheme rotting
      # while the default keeps passing.
      - name: Assemble the drawer shell too
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease -PpadpdNav=drawer \
            -PpadpdBuildPython="${{ steps.py.outputs.python-path }}" \
            2>&1 | tee "$RUNNER_TEMP/gradle-drawer.log"

      - name: Surface drawer build failure
        if: failure()
        run: .github/scripts/surface-gradle-failure.sh "$RUNNER_TEMP/gradle-drawer.log"

      - name: Report APK size
        working-directory: android
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          bytes=$(stat -c%s "$apk")
          mb=$(awk "BEGIN {printf \"%.1f\", $bytes/1048576}")
          {
            echo "## APK size (arm64-v8a, release)"
            echo
            echo "\`$(basename "$apk")\` — **${mb} MB**"
            echo
            echo "Acceptance criterion 4 is < 120 MB."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $apk  ${mb} MB"
          # Fail loudly rather than letting a bloated build pass quietly.
          awk "BEGIN {exit !($bytes > 120*1048576)}" \
            && { echo "::error::APK is ${mb} MB, over the 120 MB budget"; exit 1; } \
            || true

      - name: What Chaquopy actually packaged
        working-directory: android
        run: |
          # Which numpy/scipy versions were resolved matters for
          # reproducing the numbers later, and is not otherwise recorded.
          find app/build -name 'requirements*.txt' -exec sh -c \
            'echo "--- {} ---"; cat "{}"' \; || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: padpd-arm64-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # Every chart spec, built through the real bridge and drawn on a device.
  # A renamed spec field, an empty blob or a renderer that throws on one
  # panel shape would otherwise reach a phone before anyone noticed.
  #
  # Timings from this job are NOT performance evidence: GitHub's x86_64
  # emulator runs under KVM on the runner's own CPU and emulates no ARM.
  instrumented:
    # Both navigation shells, because the shell is chosen at build time
    # and a build can only wear one. The legs run concurrently, so this
    # costs runner minutes rather than wall clock. fail-fast off: which
    # shell broke is the first thing worth knowing, and cancelling the
    # other leg withholds it.
    name: Instrumented tests (x86_64, ${{ matrix.nav }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nav: [classic, drawer]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Must match app/build.gradle's `python version` - see the build job.
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.10"

      # cache-disabled, unlike in the build job. Its post-action runs a
      # Gradle cache cleanup at --info and emits ~100 lines AFTER every
      # step of this job, which buries the probe report and the failure
      # diagnostics at a point in the log no step of mine can reach past.
      # This job is dominated by emulator boot anyway, so the cache was
      # buying very little.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate Gradle wrapper
        run: ./.github/scripts/gen-gradle-wrapper.sh android "$GRADLE_VERSION"

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # ONE line. The action runs each line of `script` in its own
          # shell, so nothing persists between lines - not variables, not
          # cd, not set +e. See the script's header comment.
          script: .github/scripts/run-android-tests-on-emulator.sh "${{ steps.py.outputs.python-path }}" "${{ matrix.nav }}"

      - name: Surface Gradle failure
        if: failure()
        run: .github/scripts/surface-gradle-failure.sh android-test-artifacts/gradle-test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-reports-${{ matrix.nav }}
          path: android-test-artifacts/**
          if-no-files-found: warn
