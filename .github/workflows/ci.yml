name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        include:
          # extra Python versions only on Linux to keep the matrix small
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e .[dev]
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: pytest tests/ -q
        # OpenDPD-dataset tests skip automatically when the repo clone is
        # absent; iverilog-dependent RTL tests skip when iverilog is not
        # installed (the test-rtl job below installs it to exercise them).

  # dedicated Linux job with iverilog so the RTL bit-true tests actually run
  test-rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install
        run: pip install -e .[dev]
      - name: RTL tests
        run: pytest tests/test_rtl.py -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: padpd-dist
          path: dist/*
