name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # weekly: full matrix + OpenDPD equivalence job

# Every job here only reads the checkout. Spelling that out keeps the
# token from carrying whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  # Static checking. There was none at all until this job existed - see
  # the [tool.ruff] block in pyproject.toml for why E402 and BLE001 are
  # switched on rather than off.
  #
  # Runs on the oldest supported Python on purpose. Ruff's parser accepts
  # PEP 701 f-strings whatever target-version says, so it will not tell
  # you that a multi-line f-string expression is a syntax error on 3.10;
  # compileall will. scripts/ is imported by no test, so without this
  # step nothing in CI ever parses it.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ruff
        # Pinned: an unpinned ruff turns every upstream rule addition
        # into a red build on an unrelated commit.
        run: pip install "ruff==0.16.6"
      - name: Ruff
        run: ruff check .
      - name: Byte-compile everything, including what no test imports
        run: |
          python -m compileall -q src gui gui_core gui_qt scripts tests \
                 android/app/src/main/python

  # cross-platform fast lane: everything except tests marked "slow"
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        include:
          # extra Python versions only on Linux to keep the matrix small
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e .[dev]
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test (fast lane)
        run: pytest tests/ -q -m "not slow"

  # single Linux job running the FULL suite (incl. slow neural tests)
  # with onnx/onnxruntime installed so the ONNX numeric verification is
  # actually exercised rather than silently self-disabling
  test-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -e .[dev]
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxscript onnxruntime
      # The only lane that measures coverage: it is the only one where
      # every optional dependency is present, so a module does not look
      # untested merely because torch or onnxruntime was missing.
      #
      # The floor is a ratchet, not a target: raise it when the number
      # rises, never lower it to make a change fit. Measured here on
      # 2026-09-12: 92.10% of 3960 statements. The 2-point gap absorbs a
      # refactor that moves lines around without removing tests.
      - name: Test (full, with coverage)
        run: |
          pytest tests/ -q --cov=padpd --cov=gui_core \
                 --cov-report=term-missing:skip-covered \
                 --cov-fail-under=90

  # headless GUI suites (web + Qt + i18n + manual) — these silently
  # skipped before because no CI job installed the GUI stacks
  test-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System Qt deps
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install
        run: pip install -e .[dev,gui,gui-qt]
      - name: GUI tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/test_gui_core.py tests/test_gui_web.py \
                 tests/test_gui_qt.py tests/test_gui_i18n.py \
                 tests/test_manual.py -q

  # dedicated Linux job with iverilog so the RTL bit-true tests actually run
  test-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install
        run: pip install -e .[dev]
      - name: RTL tests
        run: pytest tests/test_rtl.py -q

  # weekly / on-demand: clone OpenDPD and run the real-data numeric
  # equivalence tests that skip everywhere else
  test-opendpd:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache OpenDPD clone
        uses: actions/cache@v4
        with:
          path: OpenDPD
          key: opendpd-datasets-v1
      - name: Clone OpenDPD (if not cached)
        run: test -d OpenDPD || git clone --depth 1 https://github.com/lab-emi/OpenDPD.git
      - name: Install
        run: pip install -e .[dev]
      - name: Real-data equivalence tests
        env:
          OPENDPD_ROOT: ${{ github.workspace }}/OpenDPD
        run: |
          pytest tests/test_opendpd_data.py tests/test_opendpd_metrics.py \
                 -q -rs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: padpd-dist
          path: dist/*
