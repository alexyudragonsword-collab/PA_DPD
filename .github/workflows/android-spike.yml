name: Android spike (Phase 0)

# Answers the Phase 0 feasibility questions that need a network and an
# Android SDK - neither of which the authoring environment had. See
# android/README.md for the five acceptance criteria this feeds.
#
# Deliberately not part of CI's push trigger: it downloads an Android
# SDK, a Chaquopy toolchain and an emulator image, so it runs only when
# the spike itself changes or someone asks for it.

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-spike.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-spike.yml"

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.10.2"

jobs:
  # Criterion 4 (APK size), plus the things a build proves on its own:
  # that the plugin versions resolve, that Chaquopy has arm64 numpy and
  # scipy wheels, and that the Kotlin compiles.
  build:
    name: Build arm64 release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy runs pip with a local interpreter ("buildPython"). Pin it
      # rather than letting it pick whatever is first on PATH.
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version "$GRADLE_VERSION"

      - name: Assemble release (arm64-v8a)
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            -PpadpdBuildPython="${{ steps.py.outputs.python-path }}" \
            --stacktrace

      - name: Report APK size
        working-directory: android
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          bytes=$(stat -c%s "$apk")
          mb=$(awk "BEGIN {printf \"%.1f\", $bytes/1048576}")
          {
            echo "## APK size (arm64-v8a, release)"
            echo
            echo "\`$(basename "$apk")\` — **${mb} MB**"
            echo
            echo "Acceptance criterion 4 is < 120 MB."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $apk  ${mb} MB"
          # Fail loudly rather than letting a bloated build pass quietly.
          awk "BEGIN {exit !($bytes > 120*1048576)}" \
            && { echo "::error::APK is ${mb} MB, over the 120 MB budget"; exit 1; } \
            || true

      - name: What Chaquopy actually packaged
        working-directory: android
        run: |
          # Which numpy/scipy versions were resolved matters for
          # reproducing the numbers later, and is not otherwise recorded.
          find app/build -name 'requirements*.txt' -exec sh -c \
            'echo "--- {} ---"; cat "{}"' \; || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: padpd-spike-arm64-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # Criteria 1, 2 and 5: scipy submodules, a torch-free service-layer
  # import, and Python startup time.
  #
  # NOT criterion 3. GitHub runners only have x86_64 emulators, and
  # emulated x86_64 timings say nothing about an arm64 phone. The
  # benchmark budget still has to be checked on real hardware.
  probe:
    name: Run probe on emulator (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version "$GRADLE_VERSION"

      - name: Run probe as an instrumented test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            cd android
            set +e
            ./gradlew :app:connectedDebugAndroidTest \
              -PpadpdAbis=x86_64 \
              -PpadpdBuildPython="${{ steps.py.outputs.python-path }}" \
              --stacktrace
            status=$?
            # Collect the report whether or not the assertions passed - a
            # failing probe is exactly when its output is worth reading.
            adb logcat -d -s padpd-probe:I > "$GITHUB_WORKSPACE/probe-logcat.txt"
            adb pull \
              /sdcard/Android/data/com.padpd.spike/files/probe-report.txt \
              "$GITHUB_WORKSPACE/probe-report.txt"
            exit $status

      - name: Publish probe report
        if: always()
        run: |
          report=probe-report.txt
          [ -s "$report" ] || report=probe-logcat.txt
          {
            echo "## Probe report (emulated x86_64)"
            echo
            echo "Criteria 1, 2 and 5 only — timings here are **not**"
            echo "representative of an arm64 phone."
            echo
            echo '```'
            cat "$report" 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$report" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report
          path: |
            probe-report.txt
            probe-logcat.txt
            android/app/build/reports/androidTests/**
          if-no-files-found: warn
