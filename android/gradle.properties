org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true

# org.gradle.parallel is deliberately NOT set. It buys nothing here - this
# build has a single module - and it puts Gradle into a stricter
# project-state locking mode that the Kotlin plugin trips over while
# resolving friendPaths at execution time:
#
#   > Task :app:compileReleaseKotlin FAILED
#   > Error while evaluating property 'friendPathsSet$kotlin_gradle_plugin_common'
#      > Current thread does not hold the state lock for root project
#
# Reads like a Kotlin compile error; is not one.

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Required by com.android.compose.screenshot, which is still alpha. It adds
# the screenshotTest source set and the update/validate tasks; it does not
# change assemble or connectedAndroidTest.
android.experimental.enableScreenshotTest=true
