plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Kotlin 2.0 moved the Compose compiler out of AGP into its own
    // Kotlin plugin; it must track the Kotlin version, not the AGP one.
    id 'org.jetbrains.kotlin.plugin.compose'
    // Chart specs arrive as JSON with ~15 fields per panel and several
    // nullable ones. Hand-rolled org.json parsing at that size is a
    // reliable source of silent field-name typos, so parse into typed
    // classes instead and let a mismatch fail loudly at the boundary.
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.chaquo.python'
    id 'com.android.compose.screenshot'
}

// Which ABIs to package. Defaults to arm64-v8a: extra ABIs multiply APK
// size and build time, and every device we care about runs arm64.
// Phase 1+ ships the rest through an App Bundle.
//
// CI overrides it (-PpadpdAbis=x86_64) because GitHub's runners only
// offer x86_64 emulators - an arm64-only APK will not install on one.
// The size number still comes from a default (arm64-only) build.
def targetAbis = (project.findProperty('padpdAbis') ?: 'arm64-v8a')
        .toString().split(',').collect { it.trim() }.findAll { it }

// The Python version Chaquopy targets. 3.11 is the obvious choice and it
// is wrong: Chaquopy's repository has no scipy wheel above cp310, so on
// 3.11 pip finds nothing there, falls through to a PyPI source tarball,
// and the build dies trying to cross-compile scipy for Android. 3.10 is
// the newest Python with a complete numpy+scipy set, and still satisfies
// padpd's requires-python = ">=3.10".
def pythonVersion = '3.10'

// Which navigation shell to build. Same shape as padpdAbis above, and
// for the same reason: it is a build-time choice, so it is a Gradle
// property rather than a runtime setting.
//
//   ./gradlew assembleRelease -PpadpdNav=drawer
//
// Default 'classic' means a build with no extra arguments behaves
// exactly as it did before the drawer shell existed. Validated here
// rather than in Kotlin, because a typo should stop the build instead
// of silently selecting the default and shipping the wrong UI.
def navShell = (project.findProperty('padpdNav') ?: 'classic').toString()
if (!(navShell in ['classic', 'drawer'])) {
    throw new GradleException(
        "padpdNav must be 'classic' or 'drawer', got '${navShell}'")
}

// Whether padpd ships as Cython-compiled .so instead of readable .py.
//
//   ./gradlew assembleRelease -PpadpdCompiled=true
//
// Same shape and same default reasoning as padpdNav above: a build with
// no extra arguments behaves exactly as it did before this existed.
//
// The wheels are NOT built here. Cross-compiling needs the NDK and a
// Cython run per module, which is a minute of work that has nothing to
// do with Gradle's model of this project; making it a Gradle task would
// also make the NDK a requirement of every ordinary build. So the
// wheels are an input: build them first, then build with this flag.
def compiled = (project.findProperty('padpdCompiled') ?: 'false')
        .toString().toBoolean()
def pysrc = file('pysrc')

// One wheel per ABI, so every ABI being packaged needs one present.
// Checked at configuration time rather than left to pip, because pip's
// own failure here ("No matching distribution found for padpd") names
// neither the ABI nor the command that produces the file.
if (compiled) {
    targetAbis.each { abi ->
        def want = "android_21_${abi.replace('-', '_')}"
        def hit = (pysrc.listFiles() ?: []).find {
            it.name.startsWith('padpd-') && it.name.endsWith('.whl') &&
                    it.name.contains(want)
        }
        if (!hit) {
            throw new GradleException(
                "-PpadpdCompiled=true, but ${pysrc} holds no padpd wheel " +
                "for ${abi}. Build it from the repo root:\n" +
                "  python scripts/android/android_wheel.py --package padpd " +
                "--compile all \\\n" +
                "      --abi ${abi} --ndk \"\$ANDROID_NDK_HOME\" \\\n" +
                "      --target-version 3.10.15-0 --strip-requires")
        }
    }
}

// Chaquopy needs a local Python 3 to run pip. It normally auto-detects
// one; CI pins it so the build does not depend on which python happens
// to be first on PATH.
def buildPythonPath = project.findProperty('padpdBuildPython')

// buildPython must be the SAME major.minor as the target, because pip
// checks each wheel's Requires-Python against the interpreter it is
// running under rather than against the target. A mismatch is
// particularly nasty: pip downloads the correct cp310 Android wheels,
// then rejects them ("Package 'scipy' requires a different Python:
// 3.11.16 not in '>=3.8,<3.11'"), so the error names scipy and says
// nothing about buildPython. Fail here instead, before the download.
if (buildPythonPath) {
    def proc = [buildPythonPath.toString(), '-c',
                'import sys; print("%d.%d" % sys.version_info[:2])'].execute()
    proc.waitFor()
    def found = proc.in.text.trim()
    if (found != pythonVersion) {
        throw new GradleException(
            "buildPython at ${buildPythonPath} is Python ${found}, but this " +
            "build targets Python ${pythonVersion}. pip would download the " +
            "right Android wheels and then reject them on Requires-Python. " +
            "Point -PpadpdBuildPython at a ${pythonVersion} interpreter.")
    }
}

android {
    namespace 'com.padpd'
    compileSdk 35

    // Both halves are required, and the module-level one is the half
    // that is easy to miss. Setting only the gradle.properties flag gets
    // you as far as configuration and then:
    //
    //   > Please enable screenshotTest source set in module first to
    //     apply the screenshot test plugin.
    //
    // which is a good error - it names the fix - but it is a whole
    // build to find out.
    experimentalProperties["android.experimental.enableScreenshotTest"] = true

    defaultConfig {
        applicationId "com.padpd"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        // Read by com.padpd.shell.AppShell. A String rather than a
        // boolean so a third shell would not need the field's meaning
        // renegotiated.
        buildConfigField "String", "NAV_SHELL", "\"${navShell}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Turns on the channel that gets screenshots off the device.
        // With the test storage service running, AGP passes the tests an
        // `additionalTestOutputDir` and pulls it afterwards into
        // build/outputs/connected_android_test_additional_output. The
        // alternative - writing to the app's external files directory and
        // pulling that - needs root on API 30+, and this emulator is
        // API 34. See androidTest/.../Screenshots.kt.
        testInstrumentationRunnerArguments useTestStorageService: 'true'

        ndk {
            abiFilters.addAll(targetAbis)
        }

        python {
            version pythonVersion

            if (buildPythonPath) {
                buildPython buildPythonPath.toString()
            }

            pip {
                // Pinned rather than floating, for the same reason: an
                // unpinned install lets PyPI's newer versions win the
                // resolution over Chaquopy's Android wheels, and PyPI has
                // no Android build. These are the newest versions the
                // platform can actually supply - Chaquopy's top scipy is
                // 1.8.1, which in turn caps numpy at <1.25.
                //
                // Both sit BELOW padpd's declared floors (numpy>=1.24,
                // scipy>=1.10). The suite passes on them anyway - measured,
                // not assumed - and android-deps-floor.yml keeps that true.
                install "numpy==1.23.3"
                install "scipy==1.8.1"

                if (compiled) {
                    // --find-links, never a path install. pip matches
                    // wheel tags only when choosing from a link set;
                    // handed a path it installs what it was given, so
                    // the arm64 wheel would land in the x86_64 build
                    // too - installing cleanly and dying at import with
                    // an ELF-header error that names nothing near here.
                    options "--find-links", pysrc.absolutePath
                    install "padpd"
                }
            }
        }
    }

    sourceSets {
        main {
            python {
                srcDirs = [
                    "src/main/python",
                    layout.buildDirectory.dir("python-src").get().asFile.path,
                ]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug-signed so `assembleRelease` yields an installable APK
            // whose size CI can measure. A shipping release needs its own
            // signing config.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        // Off by default in AGP 8; NAV_SHELL above needs it.
        buildConfig true
    }

    testOptions {
        unitTests {
            // Scale mapping, tick generation and blob decoding are pure
            // arithmetic. Running them as JVM tests keeps that feedback in
            // seconds instead of behind an emulator boot.
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    // The screenshotTest source set renders @Preview functions on the JVM
    // through layoutlib, so it needs the tooling annotations and the
    // serialization runtime the fixtures are parsed with. It does not get
    // them from the main source set's configurations.
    screenshotTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    screenshotTestImplementation 'androidx.compose.ui:ui-tooling'
    screenshotTestImplementation 'androidx.compose.ui:ui-tooling-preview'
    screenshotTestImplementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    // Installed alongside the test APK rather than compiled into it -
    // it is the service that backs useTestStorageService above.
    androidTestUtil 'androidx.test.services:test-services:1.5.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// ---------------------------------------------------------------------------
// Stage the Python sources Chaquopy should package.
//
// The app must run the SAME padpd/gui_core code the desktop GUIs run -
// a copy would drift, and the whole architecture rests on gui_core/services.py
// being one shared contract. But pointing srcDirs at the repo root would
// also sweep in tests/, docs/ and the 2.9 MB manual/, so stage exactly the
// two packages instead.
// ---------------------------------------------------------------------------
def repoRoot = rootProject.projectDir.parentFile

tasks.register('stagePythonSources', Sync) {
    description = 'Copy padpd + gui_core from the repo into the Chaquopy source dir'
    into layout.buildDirectory.dir("python-src")

    // With -PpadpdCompiled=true padpd arrives as a wheel instead, and
    // staging it here as well would be worse than redundant: the app
    // payload precedes the requirements on sys.path, so the .py would
    // shadow the .so and the compiled build would run interpreted while
    // looking exactly like a compiled one. Sync deletes the staged copy
    // when this branch stops contributing it, so switching back and
    // forth needs no clean.
    if (!compiled) {
        from("$repoRoot/src") {
            include 'padpd/**'
        }
    }
    from(repoRoot) {
        include 'gui_core/**'
        // manual.py resolves MANUAL_DIR as gui_core's parent directory,
        // so staging manual/ alongside it makes that module work on the
        // phone with no change at all. 2.9 MB of Markdown and PNGs.
        include 'manual/**'
        // The Data screen's two bundled demos: services.EXAMPLE_COMPLETE_NPZ
        // and EXAMPLE_TWO_TONE_CSV resolve under the repo root, which is
        // gui_core's parent here too. 1.0 MB, and without them that screen
        // has nothing to show until the user finds a file to import.
        include 'examples/**'
    }
    exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo'

    doFirst {
        if (!file("$repoRoot/gui_core/services.py").exists()) {
            throw new GradleException(
                "Expected the padpd repo at ${repoRoot}. This project must " +
                "stay inside the repo tree; it reads ../src and ../gui_core.")
        }
    }
}

// Chaquopy's task names vary across plugin versions, so bind by name
// pattern rather than hardcoding one. Sync is up-to-date-checked, so the
// broad match costs nothing on incremental builds.
tasks.configureEach { t ->
    if (t.name != 'stagePythonSources' &&
        t.name.toLowerCase().contains('python')) {
        t.dependsOn 'stagePythonSources'
    }
}
tasks.named('preBuild') { dependsOn 'stagePythonSources' }
